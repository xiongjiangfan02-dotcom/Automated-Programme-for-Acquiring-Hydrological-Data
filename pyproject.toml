[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bijie-hydro-collector"
version = "0.4.0"
description = "贵州省大型水库实时水情采集模块"
requires-python = ">=3.11"
dependencies = [
  "fonttools>=4.58,<5",
  "openpyxl>=3.1,<4",
  "tzdata>=2025.2",
]

[project.scripts]
bijie-hydro = "bijie_hydro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

